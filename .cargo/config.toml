# screencapturekit links @rpath/libswift_Concurrency.dylib, which on macOS 12+ lives only in the
# dyld shared cache under /usr/lib/swift. Give every binary (tests and benches included) that
# rpath. A DYLD_LIBRARY_PATH to Xcode's swift-5.5 back-deploy copy loaded a second Swift runtime
# and broke `xcodebuild -find clang` on CI (Xcode 26.6).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
