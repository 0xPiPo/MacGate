name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace + patched IronRDP crates)
        run: make test
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  swift:
    name: Swift package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: MacRDPKit tests
        working-directory: macrdp-app/MacRDPKit
        run: swift test
