# XcodeGen spec for the macrdp menu-bar app. `make app` (repo root) generates, builds,
# bundles the Rust helper and signs. By hand: `cd macrdp-app && xcodegen generate`.
name: macrdp
options:
  bundleIdPrefix: com.macrdp
  deploymentTarget:
    macOS: "26.0"
packages:
  MacRDPKit:
    path: MacRDPKit
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  macrdp:
    type: application
    platform: macOS
    sources:
      - path: App
      # Holds AppIcon.icon (Icon Composer) and Assets.xcassets (menu-bar template images).
      - path: Resources
    dependencies:
      - package: MacRDPKit
    settings:
      base:
        PRODUCT_NAME: macrdp
        PRODUCT_BUNDLE_IDENTIFIER: com.macrdp.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: macrdp
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # The Icon Composer file Resources/AppIcon.icon, by name without `.icon`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The helper reaches private APIs through dlsym; hardened runtime stays off for now.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_DEBUG_DYLIB: NO
    scheme: {}
