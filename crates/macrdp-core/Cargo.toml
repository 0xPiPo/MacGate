[package]
name = "macrdp-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
macrdp-capture = { path = "../macrdp-capture" }
macrdp-input = { path = "../macrdp-input" }
macrdp-encode = { path = "../macrdp-encode" }
macrdp-audio = { path = "../macrdp-audio" }
macrdp-clipboard = { path = "../macrdp-clipboard" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
bytes.workspace = true
ironrdp-server = { version = "0.10", features = ["helper"] }
ironrdp-pdu = "0.7"
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rcgen = "0.13"
dirs = "6"
md4 = "0.10"
zeroize = "1"
libc = "0.2"
security-framework = "3"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
ring = "0.17"
x509-cert = "0.2"

[dev-dependencies]
tempfile = "3"
const-oid = { version = "0.9", features = ["db"] }
tokio = { workspace = true, features = ["test-util"] }
